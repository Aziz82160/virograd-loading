<title>Virograd Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<style>
  :root{
    --bg-deep:#100d0a;
    --bg-mid:#1b1610;
    --steel:#3c4038;
    --steel-line:#2a2d27;
    --rust:#c25a34;
    --rust-dim:#7a3620;
    --toxic:#b9c93f;
    --toxic-dim:#6e7a26;
    --alarm:#9a2415;
    --paper:#e9e2d2;
    --paper-dim:#a89d87;
    --ink:#0b0906;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-deep);
    color:var(--paper);
    font-family:'Share Tech Mono','Courier New',monospace;
    overflow:hidden;
    position:relative;
    padding:0 16px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- background scene ---------- */
  #scene{
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(154,36,21,.16), transparent 70%),
      radial-gradient(ellipse 80% 50% at 20% 100%, rgba(122,54,32,.22), transparent 60%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #241d15 100%);
  }
  #particles{position:fixed;inset:0;z-index:1;pointer-events:none;}

  .skyline{position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:1;opacity:.9;pointer-events:none;}
  .skyline rect.window{animation:winkflicker 5s ease-in-out infinite;}
  @keyframes winkflicker{
    0%,38%,42%,100%{opacity:.85;}
    40%{opacity:.15;}
  }

  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
  }
  .scanlines{
    position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .flicker-light{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 82% 18%, rgba(201,201,150,.10), transparent 35%);
    animation:sitelight 6.5s steps(1,end) infinite;
  }
  @keyframes sitelight{
    0%,100%{opacity:1;} 4%{opacity:.3;} 6%{opacity:1;} 7%{opacity:.15;} 9%{opacity:1;}
    52%{opacity:1;} 53%{opacity:.4;} 55%{opacity:1;}
  }

  .biohazard-watermark{
    position:absolute; right:-4vw; top:-6vh; width:min(60vw,640px); height:auto;
    opacity:.06; z-index:1; pointer-events:none; transform:rotate(8deg);
  }

  /* ---------- layout shell ---------- */
  .frame{position:relative;z-index:5;display:flex;flex-direction:column;min-height:100vh;max-width:1400px;margin:0 auto;width:100%;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding-block:14px;
    border-bottom:3px solid var(--toxic-dim);
    background:repeating-linear-gradient(135deg, transparent 0 14px, rgba(185,201,63,.08) 14px 18px);
  }
  .wordmark{display:flex;align-items:center;gap:10px;font-family:'Big Shoulders Stencil',sans-serif;font-weight:700;letter-spacing:.08em;font-size:clamp(1rem,2.4vw,1.35rem);color:var(--paper);}
  .wordmark svg{width:26px;height:26px;flex:none;fill:var(--toxic);}
  .status{display:flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.12em;color:var(--paper-dim);text-transform:uppercase;}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--rust);box-shadow:0 0 8px var(--rust);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  main.hero{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding-block:clamp(24px,6vh,64px);
    position:relative;
    gap:14px;
  }
  .stamp{
    align-self:flex-end;
    border:2px solid var(--rust);
    color:var(--rust);
    padding:6px 14px;
    font-size:clamp(.68rem,1.6vw,.85rem);
    letter-spacing:.16em;
    text-transform:uppercase;
    transform:rotate(-4deg);
    border-radius:2px;
    background:rgba(154,36,21,.08);
  }
  .kicker{
    font-size:clamp(.75rem,1.8vw,.95rem);
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--toxic);
  }
  h1.title{
    position:relative;
    margin:0;
    font-family:'Big Shoulders Stencil',sans-serif;
    font-weight:900;
    text-transform:uppercase;
    font-size:clamp(3.4rem,15vw,9.5rem);
    line-height:.86;
    letter-spacing:.01em;
    color:var(--paper);
    text-shadow:0 6px 30px rgba(0,0,0,.6);
    text-wrap:balance;
  }
  h1.title::before,h1.title::after{
    content:attr(data-text);
    position:absolute;inset:0;
    opacity:0;
  }
  h1.title.glitching::before{color:var(--alarm);opacity:.75;transform:translate(-6px,2px);clip-path:inset(10% 0 55% 0);}
  h1.title.glitching::after{color:var(--toxic);opacity:.65;transform:translate(5px,-3px);clip-path:inset(60% 0 5% 0);}

  .tagline{margin:0;max-width:56ch;font-size:clamp(.95rem,2vw,1.15rem);color:var(--paper-dim);line-height:1.5;}
  .tagline b{color:var(--paper);font-weight:400;border-bottom:1px solid var(--rust-dim);}

  /* ---------- console / HUD footer ---------- */
  footer.console{
    position:relative;z-index:5;
    border-top:1px solid var(--steel-line);
    background:linear-gradient(180deg, rgba(16,13,10,.2), rgba(16,13,10,.78));
    padding-block:14px 18px;
    display:flex;flex-direction:column;gap:10px;
  }
  .ticker{
    display:flex;align-items:baseline;gap:10px;
    font-size:.85rem;letter-spacing:.03em;color:var(--paper-dim);
    min-height:1.4em;
  }
  .ticker .tag{color:var(--rust);font-weight:700;letter-spacing:.1em;flex:none;}
  .ticker .msg{transition:opacity .4s ease;}
  .ticker .msg.fade{opacity:0;}

  .bar-row{display:flex;align-items:center;gap:14px;}
  .bar-track{
    flex:1;height:14px;border:1px solid var(--steel);background:var(--ink);
    position:relative;overflow:hidden;border-radius:1px;
  }
  .bar-track::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.35) 8px 9px);
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, var(--rust-dim), var(--rust));
    box-shadow:0 0 10px rgba(194,90,52,.6);
    transition:width .35s ease-out;
  }
  .pct{font-variant-numeric:tabular-nums;min-width:3.6ch;text-align:right;font-size:1rem;color:var(--paper);}

  .meta-row{
    display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;
    font-size:.76rem;letter-spacing:.06em;color:var(--paper-dim);text-transform:uppercase;
  }
  .meta-row .grp{display:flex;gap:18px;flex-wrap:wrap;}
  .meta-row span b{display:block;font-size:.68rem;color:var(--toxic-dim);letter-spacing:.14em;font-weight:400;}
  .meta-row span em{font-style:normal;color:var(--paper);font-variant-numeric:tabular-nums;}
  #current-file{color:var(--paper-dim);}

  @media (max-width:560px){
    header.topbar{flex-direction:column;align-items:flex-start;gap:6px;}
    .stamp{align-self:flex-start;}
    .meta-row{flex-direction:column;gap:8px;}
    .meta-row .grp{gap:14px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>

<script>
(function(){
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- ambient ash / ember particles ---------- */
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  function spawn(kind){
    return {
      kind: kind,
      x: Math.random()*canvas.width,
      y: canvas.height + 10 + Math.random()*40,
      r: kind==='ember' ? 1.4+Math.random()*1.8 : 0.8+Math.random()*1.6,
      speed: kind==='ember' ? 0.5+Math.random()*0.9 : 0.15+Math.random()*0.35,
      sway: Math.random()*0.02+0.005,
      phase: Math.random()*Math.PI*2,
      life: 0,
      max: kind==='ember' ? 200+Math.random()*200 : 400+Math.random()*400
    };
  }
  var count = reduceMotion ? 0 : 46;
  for(var i=0;i<count;i++){ particles.push(spawn(i%5===0?'ember':'ash')); particles[i].y = Math.random()*canvas.height; }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.life++;
      p.y -= p.speed;
      p.x += Math.sin(p.phase + p.life*p.sway)*0.4;
      var fade = Math.min(1, Math.min(p.life/40, (p.max-p.life)/40));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      if(p.kind==='ember'){
        ctx.fillStyle = 'rgba(194,90,52,'+(0.55*fade)+')';
        ctx.shadowColor = 'rgba(194,90,52,.8)'; ctx.shadowBlur = 6;
      } else {
        ctx.fillStyle = 'rgba(210,204,190,'+(0.3*fade)+')';
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      if(p.life > p.max || p.y < -10){ particles[i] = spawn(p.kind); }
    }
    if(!reduceMotion) requestAnimationFrame(tick);
  }
  if(!reduceMotion) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);

  /* ---------- title glitch bursts ---------- */
  if(!reduceMotion){
    var titleEl = document.getElementById('title');
    (function glitchLoop(){
      var delay = 4000 + Math.random()*5000;
      setTimeout(function(){
        titleEl.classList.add('glitching');
        setTimeout(function(){ titleEl.classList.remove('glitching'); }, 260);
        glitchLoop();
      }, delay);
    })();
  }

  /* ---------- bulletin ticker ---------- */
  var bulletins = [
    'Les cartes de rationnement sont contrôlées à chaque poste. Pas de carte, pas de ravitaillement.',
    'Faites bouillir l\'eau du canal avant de la consommer.',
    'Le couvre-feu débute à 21h00. Les patrouilles ne préviennent qu\'une fois.',
    'Signalez toute fièvre ou lésion à la clinique de la rue Marx sans délai.',
    'Le secteur 7 reste scellé en attendant la décontamination.',
    'Ici, le carburant est une monnaie. Les promesses n\'en sont pas une.',
    'Les parasites sur le canal 4 ne sont pas une panne.'
  ];
  var tickerEl = document.getElementById('ticker-text');
  var bi = 0;
  function showBulletin(){
    tickerEl.textContent = bulletins[bi % bulletins.length];
    bi++;
  }
  showBulletin();
  setInterval(function(){
    tickerEl.classList.add('fade');
    setTimeout(function(){ showBulletin(); tickerEl.classList.remove('fade'); }, 400);
  }, 5200);

  /* ---------- loading state, driven by GMod or by demo fallback ---------- */
  var barFill = document.getElementById('bar-fill');
  var pctEl = document.getElementById('pct');
  var filesEl = document.getElementById('files-count');
  var currentFileEl = document.getElementById('current-file');
  var connEl = document.getElementById('conn-status');

  var state = { total:0, needed:0, live:false };

  function render(){
    var pct = state.total > 0 ? Math.round(100*(state.total-state.needed)/state.total) : 0;
    pct = Math.max(0, Math.min(100, pct));
    barFill.style.width = pct + '%';
    pctEl.textContent = pct + '%';
    filesEl.textContent = Math.max(0,state.total-state.needed) + ' / ' + state.total;
    connEl.textContent = pct >= 100 ? 'SYNCHRONISÉ' : 'LIAISON EN COURS';
  }

  // Real GMod loading-screen hooks (called by the engine when this page is
  // set via sv_loadingurl). Wiring these up marks the feed as "live" and
  // stops the local demo simulation below.
  window.GameDetails = function(serverName, serverURL, mapName, maxPlayers, steamID, gameMode){
    state.live = true;
  };
  window.SetFilesTotal = function(total){ state.live = true; state.total = total; state.needed = total; render(); };
  window.SetFilesNeeded = function(needed){ state.live = true; state.needed = needed; render(); };
  window.DownloadingFile = function(fileName){ state.live = true; currentFileEl.textContent = fileName; render(); };
  window.FileError = function(fileName){ currentFileEl.textContent = 'erreur : ' + fileName; };

  // Demo simulation, only for previewing this page outside the game.
  var demoFiles = [
    'maps/rp_virograd_v3.bsp',
    'materials/hud/biohazard_overlay.vtf',
    'materials/checkpoint/barrier_rust.vtf',
    'models/props_industrial/generator_01.mdl',
    'models/survivors/citizen_worn_04.mdl',
    'sound/ambient/sirens/curfew_loop.wav',
    'resource/fonts/stencil_broadcast.ttf',
    'lua/autorun/epoch_quarantine_hud.lua',
    'materials/decals/quarantine_tape.vtf',
    'sound/radio/bulletin_static.wav'
  ];
  setTimeout(function(){
    if(state.live) return;
    var total = demoFiles.length * 18;
    state.total = total; state.needed = total; render();
    var idx = 0;
    var demoTimer = setInterval(function(){
      if(state.live){ clearInterval(demoTimer); return; }
      if(state.needed <= 0){
        clearInterval(demoTimer);
        setTimeout(function(){
          state.needed = state.total;
          currentFileEl.textContent = 'en attente du manifeste…';
          render();
          runDemo();
        }, 2200);
        return;
      }
      state.needed = Math.max(0, state.needed - (2+Math.floor(Math.random()*3)));
      currentFileEl.textContent = demoFiles[idx % demoFiles.length];
      idx++;
      render();
    }, 260);
    function runDemo(){
      idx = 0;
      demoTimer = setInterval(function(){
        if(state.live){ clearInterval(demoTimer); return; }
        if(state.needed <= 0){
          clearInterval(demoTimer);
          setTimeout(function(){ state.needed = state.total; currentFileEl.textContent='awaiting manifest…'; render(); runDemo(); }, 2200);
          return;
        }
        state.needed = Math.max(0, state.needed - (2+Math.floor(Math.random()*3)));
        currentFileEl.textContent = demoFiles[idx % demoFiles.length];
        idx++;
        render();
      }, 260);
    }
  }, 700);

  render();
})();
</script>
