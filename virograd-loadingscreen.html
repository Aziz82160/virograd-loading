<title>Virograd Checkpoint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@400;700;900&family=Share+Tech+Mono&display=swap">
<style>
  /* Tout est en rem : la taille de base est recalculée en JS selon la résolution
     (1920x1080 = 16px). Pas de var(), clamp(), min() ni flex pour rester
     compatible avec le vieux navigateur intégré de GMod (Awesomium). */
  *{-webkit-box-sizing:border-box;box-sizing:border-box;}
  html{font-size:16px;}
  html,body{width:100%;height:100%;}
  body{
    margin:0;padding:0;
    background:#100d0a;
    color:#e9e2d2;
    font-family:'Share Tech Mono','Courier New',monospace;
    overflow:hidden;
    position:relative;
  }

  /* ---------- background scene ---------- */
  #scene{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;
    background:#100d0a;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(154,36,21,.16), transparent 70%),
      radial-gradient(ellipse 80% 50% at 20% 100%, rgba(122,54,32,.22), transparent 60%),
      linear-gradient(180deg, #100d0a 0%, #1b1610 55%, #241d15 100%);
  }
  #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}

  .skyline{position:fixed;left:0;bottom:0;width:100%;height:38%;z-index:1;opacity:.9;pointer-events:none;}
  .skyline rect.window{-webkit-animation:winkflicker 5s ease-in-out infinite;animation:winkflicker 5s ease-in-out infinite;}
  @-webkit-keyframes winkflicker{0%,38%,42%,100%{opacity:.85;}40%{opacity:.15;}}
  @keyframes winkflicker{0%,38%,42%,100%{opacity:.85;}40%{opacity:.15;}}

  .vignette{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
  }
  .scanlines{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:4;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px);
  }
  .flicker-light{
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
    background:radial-gradient(circle at 82% 18%, rgba(201,201,150,.10), transparent 35%);
    -webkit-animation:sitelight 6.5s steps(1,end) infinite;animation:sitelight 6.5s steps(1,end) infinite;
  }
  @-webkit-keyframes sitelight{0%,100%{opacity:1;}4%{opacity:.3;}6%{opacity:1;}7%{opacity:.15;}9%{opacity:1;}52%{opacity:1;}53%{opacity:.4;}55%{opacity:1;}}
  @keyframes sitelight{0%,100%{opacity:1;}4%{opacity:.3;}6%{opacity:1;}7%{opacity:.15;}9%{opacity:1;}52%{opacity:1;}53%{opacity:.4;}55%{opacity:1;}}


  /* ---------- barre du haut : toute la largeur ---------- */
  header.topbar{
    position:absolute;top:0;left:0;right:0;z-index:5;
    height:4rem;line-height:4rem;
    padding:0 3%;
    border-bottom:3px solid #6e7a26;
    background:rgba(16,13,10,.35);
    background:repeating-linear-gradient(135deg, rgba(16,13,10,.35) 0 14px, rgba(185,201,63,.08) 14px 18px);
  }
  .wordmark{
    float:left;
    font-family:'Big Shoulders Stencil',sans-serif;font-weight:700;
    letter-spacing:.08em;font-size:1.4rem;color:#e9e2d2;white-space:nowrap;
  }
  .status{
    float:right;white-space:nowrap;
    font-size:.85rem;letter-spacing:.12em;color:#a89d87;text-transform:uppercase;
  }
  .status .dot{
    display:inline-block;vertical-align:middle;margin:-.15rem .6rem 0 0;
    width:.55rem;height:.55rem;border-radius:50%;background:#c25a34;box-shadow:0 0 8px #c25a34;
    -webkit-animation:pulse 1.6s ease-in-out infinite;animation:pulse 1.6s ease-in-out infinite;
  }
  @-webkit-keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .sound-toggle{
    display:inline-block;vertical-align:middle;margin-left:1.2rem;line-height:1;
    background:none;border:1px solid #2a2d27;color:#a89d87;
    font-family:inherit;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    padding:.4rem .7rem;cursor:pointer;border-radius:2px;
  }
  .sound-toggle:hover{border-color:#6e7a26;color:#e9e2d2;}
  .sound-toggle svg{width:.95rem;height:.95rem;fill:currentColor;vertical-align:middle;margin:-.15rem .35rem 0 0;}
  .sound-toggle .icon-off{display:none;}
  .sound-toggle.muted .icon-on{display:none;}
  .sound-toggle.muted .icon-off{display:inline-block;}

  /* ---------- bloc central : calé à gauche, centré verticalement ---------- */
  main.hero{
    position:absolute;z-index:5;
    left:6%;top:47%;width:60%;
    -webkit-transform:translateY(-50%);transform:translateY(-50%);
  }
  .logo{
    position:absolute;z-index:5;
    right:6%;top:50%;width:26rem;height:auto;
    -webkit-transform:translateY(-50%);transform:translateY(-50%);
    -webkit-filter:drop-shadow(0 12px 40px rgba(0,0,0,.7));filter:drop-shadow(0 12px 40px rgba(0,0,0,.7));
  }
  .kicker{
    margin:0 0 .9rem;
    font-size:1rem;letter-spacing:.35em;text-transform:uppercase;color:#b9c93f;
  }
  h1.title{
    position:relative;margin:0 0 1.2rem;
    font-family:'Big Shoulders Stencil',sans-serif;font-weight:900;text-transform:uppercase;
    font-size:10rem;line-height:.86;letter-spacing:.01em;
    color:#e9e2d2;text-shadow:0 6px 30px rgba(0,0,0,.6);
  }
  h1.title:before,h1.title:after{
    content:attr(data-text);
    position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;
  }
  h1.title.glitching:before{color:#9a2415;opacity:.75;-webkit-transform:translate(-6px,2px);transform:translate(-6px,2px);clip:rect(0,9999px,.35em,0);}
  h1.title.glitching:after{color:#b9c93f;opacity:.65;-webkit-transform:translate(5px,-3px);transform:translate(5px,-3px);clip:rect(.55em,9999px,9999px,0);}

  .tagline{margin:0;max-width:40rem;font-size:1.2rem;color:#a89d87;line-height:1.5;}
  .tagline b{color:#e9e2d2;font-weight:400;border-bottom:1px solid #7a3620;}

  /* ---------- aide + liens ---------- */
  .infos{
    margin-top:2.6rem;padding-top:1.2rem;
    border-top:1px solid rgba(110,122,38,.5);
    max-width:46rem;
  }
  .ticker{
    font-size:.95rem;letter-spacing:.03em;color:#a89d87;min-height:1.4em;margin-bottom:.8rem;
  }
  .ticker .tag{color:#c25a34;font-weight:700;letter-spacing:.1em;margin-right:.7rem;}
  .ticker .msg{-webkit-transition:opacity .4s ease;transition:opacity .4s ease;}
  .ticker .msg.fade{opacity:0;}

  .meta-row{font-size:.85rem;letter-spacing:.06em;color:#a89d87;text-transform:uppercase;}
  .meta-row span{display:inline-block;margin-right:2.2rem;vertical-align:top;}
  .meta-row span b{display:block;font-size:.72rem;color:#6e7a26;letter-spacing:.14em;font-weight:400;margin-bottom:.15rem;}
  .meta-row span em{font-style:normal;color:#e9e2d2;}

  /* écrans étroits / portrait */
  .narrow main.hero{width:88%;}
  .mid .logo{width:22rem;right:3%;}
  .narrow .logo{display:none;}
</style>

<div id="scene"></div>
<canvas id="particles"></canvas>
<div class="flicker-light"></div>

          <span><b>Discord</b><em>discord.gg/BVRHrFgQpa</em></span>
          <span><b>Site</b><em>virograd.noclip.me</em></span>
        </div>
      </div>
    </div>
  </main>

</div>

<script>
(function(){
  /* ---------- mise à l'échelle selon la résolution ---------- */
  // Référence 1920x1080 -> 16px. On prend le plus petit ratio pour que tout
  // rentre, quel que soit l'écran (720p, 1440p, 4K, ultra-large, 4:3...).
  function rescale(){
    var w = window.innerWidth || document.documentElement.clientWidth;
    var h = window.innerHeight || document.documentElement.clientHeight;
    var ratio = Math.min(w/1920, h/1080);
    var size = Math.max(10, Math.round(16*ratio*100)/100);
    document.documentElement.style.fontSize = size + 'px';
    var root = document.documentElement;
    var narrow = (w/h) < 1.2;
    root.className = narrow ? 'narrow' : ((w/h) < 1.5 ? 'mid' : '');
  }
  rescale();
  window.addEventListener('resize', rescale);

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- ambient ash / ember particles ---------- */
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  function spawn(kind){
    return {
      kind: kind,
      x: Math.random()*canvas.width,
      y: canvas.height + 10 + Math.random()*40,
      r: kind==='ember' ? 1.4+Math.random()*1.8 : 0.8+Math.random()*1.6,
      speed: kind==='ember' ? 0.5+Math.random()*0.9 : 0.15+Math.random()*0.35,
      sway: Math.random()*0.02+0.005,
      phase: Math.random()*Math.PI*2,
      life: 0,
      max: kind==='ember' ? 200+Math.random()*200 : 400+Math.random()*400
    };
  }
  var count = reduceMotion ? 0 : 46;
  for(var i=0;i<count;i++){ particles.push(spawn(i%5===0?'ember':'ash')); particles[i].y = Math.random()*canvas.height; }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.life++;
      p.y -= p.speed;
      p.x += Math.sin(p.phase + p.life*p.sway)*0.4;
      var fade = Math.min(1, Math.min(p.life/40, (p.max-p.life)/40));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      if(p.kind==='ember'){
        ctx.fillStyle = 'rgba(194,90,52,'+(0.55*fade)+')';
        ctx.shadowColor = 'rgba(194,90,52,.8)'; ctx.shadowBlur = 6;
      } else {
        ctx.fillStyle = 'rgba(210,204,190,'+(0.3*fade)+')';
        ctx.shadowBlur = 0;
      }
      ctx.fill();
      if(p.life > p.max || p.y < -10){ particles[i] = spawn(p.kind); }
    }
    if(!reduceMotion) requestAnimationFrame(tick);
  }
  if(!reduceMotion) requestAnimationFrame(tick); else ctx.clearRect(0,0,canvas.width,canvas.height);

  /* ---------- title glitch bursts ---------- */
  if(!reduceMotion){
    var titleEl = document.getElementById('title');
    (function glitchLoop(){
      var delay = 4000 + Math.random()*5000;
      setTimeout(function(){
        titleEl.classList.add('glitching');
        setTimeout(function(){ titleEl.classList.remove('glitching'); }, 260);
        glitchLoop();
      }, delay);
    })();
  }

  /* ---------- bulletin ticker ---------- */
  var bulletins = [
    'F1 ouvre le menu permettant d\'activer la vue à la troisième personne.',
    'Appuyez deux fois rapidement sur CTRL pour vous allonger.',
    'Tapez !buddies pour ajouter ou gérer les joueurs autorisés à accéder à vos props.',
    'Tapez !ticket dans le chat pour ouvrir un ticket et contacter le staff.'
  ];
  var tickerEl = document.getElementById('ticker-text');
  var bi = 0;
  function showBulletin(){
    tickerEl.textContent = bulletins[bi % bulletins.length];
    bi++;
  }
  showBulletin();
  setInterval(function(){
    tickerEl.classList.add('fade');
    setTimeout(function(){ showBulletin(); tickerEl.classList.remove('fade'); }, 400);
  }, 5200);

  /* ---------- connection status, driven by GMod's loading hooks ---------- */
  var connEl = document.getElementById('conn-status');
  var totalFiles = 0, neededFiles = 0;

  function updateStatus(){
    connEl.textContent = (totalFiles > 0 && neededFiles <= 0) ? 'SYNCHRONISÉ' : 'LIAISON EN COURS';
  }

  /* ---------- background music ---------- */
  var bgm = document.getElementById('bgm');
  var soundBtn = document.getElementById('sound-toggle');
  var soundLabel = document.getElementById('sound-label');
  bgm.volume = 0.5;

  function setMuted(muted){
    bgm.muted = muted;
    soundBtn.classList.toggle('muted', muted);
    soundLabel.textContent = muted ? 'Son coupé' : 'Musique';
  }

  function tryAutoplay(){
    var p = bgm.play();
    if(p && p.catch){
      p.catch(function(){
        // Autoplay blocked: start on the first click/key anywhere on the page.
        setMuted(true);
        function startOnGesture(){
          bgm.play().then(function(){ setMuted(false); }).catch(function(){});
          document.removeEventListener('click', startOnGesture);
          document.removeEventListener('keydown', startOnGesture);
        }
        document.addEventListener('click', startOnGesture);
        document.addEventListener('keydown', startOnGesture);
      });
    }
  }
  setMuted(false);
  tryAutoplay();

  soundBtn.addEventListener('click', function(){
    setMuted(!bgm.muted);
    if(!bgm.muted && bgm.paused){ bgm.play().catch(function(){}); }
  });

  // Real GMod loading-screen hooks (called by the engine when this page is
  // set via sv_loadingurl).
  window.GameDetails = function(serverName, serverURL, mapName, maxPlayers, steamID, gameMode){};
  window.SetFilesTotal = function(total){ totalFiles = total; updateStatus(); };
  window.SetFilesNeeded = function(needed){ neededFiles = needed; updateStatus(); };
  window.DownloadingFile = function(fileName){};
  window.FileError = function(fileName){};
})();
</script>
